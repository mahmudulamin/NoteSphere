<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Register • NoteSphere</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./index.html" aria-label="Go to home">
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="brand__text">NoteSphere</span>
    </a>

    <div class="header-actions">
      <a class="btn btn--ghost" href="./login.html">
        <span class="btn__icon" aria-hidden="true">←</span>
        <span class="btn__text">Login</span>
      </a>

      <button id="themeToggle" class="btn btn--ghost" type="button" aria-label="Toggle theme">
        <span class="btn__icon" aria-hidden="true">◐</span>
        <span class="btn__text">Theme</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <div class="section__header">
        <div>
          <h1 class="page-title">Create Account</h1>
          <p class="muted">Sign up to start organizing your notes.</p>
        </div>
      </div>

      <div class="card" style="max-width: 520px;">
        <!-- Google Sign-In Button -->
        <div class="auth-section">
          <button id="googleSignIn" class="btn btn--google" type="button">
            <svg class="btn__icon" width="18" height="18" viewBox="0 0 18 18">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707 0-.593.102-1.17.282-1.709V4.958H.957C.347 6.173 0 7.548 0 9c0 1.452.348 2.827.957 4.042l3.007-2.335z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            <span class="btn__text">Sign up with Google</span>
          </button>
        </div>

        <div class="divider">
          <span class="divider__text">or</span>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" class="editor__form" aria-label="Register">
          <label class="editor__label" for="username">Username</label>
          <input id="username" class="editor__input" type="text" autocomplete="username" placeholder="Choose a username" required />

          <label class="editor__label" for="email">Email</label>
          <input id="email" class="editor__input" type="email" autocomplete="email" placeholder="your@email.com" required />

          <label class="editor__label" for="password">Password</label>
          <input id="password" class="editor__input" type="password" autocomplete="new-password" placeholder="At least 6 characters" required />

          <label class="editor__label" for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" class="editor__input" type="password" autocomplete="new-password" placeholder="Re-enter password" required />

          <div class="editor__actions" style="margin-top: 12px;">
            <button class="btn" type="submit">Create Account</button>
            <a class="btn btn--ghost" href="./login.html">Cancel</a>
          </div>

          <p class="muted" style="margin: 12px 0 0; font-size: 0.9rem; text-align: center;">
            Already have an account? <a href="./login.html" style="color: var(--accent);">Login here</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="assets/js/toast.js" defer></script>
  <script src="assets/js/register.js" defer></script>
</body>
</html>
